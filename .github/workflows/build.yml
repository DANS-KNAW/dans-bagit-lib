name: Build project

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
   build:
     runs-on: ubuntu-latest

     steps:
       - uses: actions/checkout@v6
       - name: Set up JDK 21
         uses: actions/setup-java@v5
         with:
           java-version: 21
           distribution: 'adopt'
           cache: 'maven'
       - name: Build with Maven
         run: mvn -B clean package --file pom.xml
